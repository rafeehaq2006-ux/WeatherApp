<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><script defer="defer" src="main.js"></script></head><body><div class="app-container"><form id="search" class="search-bar"><input id="city-input" placeholder="Enter a city name" aria-label="Search weather by city"/> <button type="submit">Search</button></form><div id="undersearch"><div id="error-message"></div><button id="unit-toggle" type="button">Switch to °F</button></div><div id="TodaysWeather" class="todays-weather"><div id="CurrentWeather" class="current-weather-card"><div class="weather-header"><div><p class="city-name">London</p><p class="weather-date"></p></div><div class="condition-badge"></div></div><div class="current-main"><div class="weather-icon" aria-label="Weather icon area"></div><div class="temperature"></div></div></div><div class="today-summary"><div class="summary-card"><h2>Today</h2><div class="summary-grid"><div class="summaryCard"><span>Sunrise</span><div id="sunrise"></div></div><div class="summaryCard"><span>Sunset</span><div id="sunset"></div></div><div class="summaryCard"><span>High</span><div id="high"></div></div><div class="summaryCard"><span>Low</span><div id="low"></div></div></div></div><div class="hourly-card"><h3>Hourly Forecast</h3><div class="hourly-scroll"></div></div><div class="forecast-card"><h3>Next 7 Days</h3><div class="forecast-grid"></div></div></div></div></div></body></html>
