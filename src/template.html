<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="app-container">
            <div id="search" class="search-bar">
                <input type="text" placeholder="Enter a city name" aria-label="Search weather by city" />
                <button type="button">Search</button>
            </div>

            <div id="TodaysWeather" class="todays-weather">
                <div id="CurrentWeather" class="current-weather-card">
                    <div class="weather-header">
                        <div>
                            <p class="city-name">London</p>
                            <p class="weather-date"></p>
                        </div>
                        <div class="condition-badge"></div>
                    </div>

                    <div class="current-main">
                        <div class="weather-icon" aria-label="Weather icon area">
                        </div>
                        <div class="temperature"></div>
                    </div>
                </div>

                <div class="today-summary">
                    <div class="summary-card">
                        <h2>Today</h2>
                        <div class="summary-grid">
                            <div class="summaryCard">
                                <span>Sunrise</span>
                                <div id="sunrise"></div>
                            </div>
                            <div class="summaryCard">
                                <span>Sunset</span>
                                <div id="sunset"></div>
                            </div>
                            <div class="summaryCard">
                                <span>High</span>
                                <div id="high"></div>
                            </div>
                            <div class="summaryCard">
                                <span>Low</span>
                                <div id="low"></div>
                            </div>
                        </div>
                    </div>

                    <div class="hourly-card">
                        <h3>Hourly Forecast</h3>
                        <div class="hourly-scroll">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
