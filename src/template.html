<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="app-container">
            <div id="search" class="search-bar">
                <input type="text" placeholder="Enter a city name" aria-label="Search weather by city" />
                <button type="button">Search</button>
            </div>

            <div id="TodaysWeather" class="todays-weather">
                <div id="CurrentWeather" class="current-weather-card">
                    <div class="weather-header">
                        <div>
                            <p class="city-name">London</p>
                            <p class="weather-date"></p>
                        </div>
                        <div class="condition-badge"></div>
                    </div>

                    <div class="current-main">
                        <div class="temperature"></div>
                        <div class="condition-details">
                            <p>Feels like 26°C</p>
                            <p>Clear skies</p>
                        </div>
                    </div>

                    <div class="current-meta">
                        <div class="meta-card">
                            <span>Humidity</span>
                            <strong>58%</strong>
                        </div>
                        <div class="meta-card">
                            <span>Wind</span>
                            <strong>12 km/h</strong>
                        </div>
                        <div class="meta-card">
                            <span>Pressure</span>
                            <strong>1012 hPa</strong>
                        </div>
                    </div>
                </div>

                <div class="today-summary">
                    <div class="summary-card">
                        <h2>Today</h2>
                        <div class="summary-grid">
                            <div>
                                <span>Sunrise</span>
                                <strong>06:10</strong>
                            </div>
                            <div>
                                <span>Sunset</span>
                                <strong>20:20</strong>
                            </div>
                            <div>
                                <span>High</span>
                                <strong>28°C</strong>
                            </div>
                            <div>
                                <span>Low</span>
                                <strong>18°C</strong>
                            </div>
                        </div>
                    </div>

                    <div class="hourly-card">
                        <h3>Hourly Forecast</h3>
                        <div class="hourly-scroll">
                            <div class="hour-slot">
                                <span>06:00</span>
                                <strong>18°C</strong>
                                <small>Cloudy</small>
                            </div>
                            <div class="hour-slot">
                                <span>09:00</span>
                                <strong>21°C</strong>
                                <small>Sunny</small>
                            </div>
                            <div class="hour-slot">
                                <span>12:00</span>
                                <strong>24°C</strong>
                                <small>Clear</small>
                            </div>
                            <div class="hour-slot">
                                <span>15:00</span>
                                <strong>26°C</strong>
                                <small>Sunny</small>
                            </div>
                            <div class="hour-slot">
                                <span>18:00</span>
                                <strong>23°C</strong>
                                <small>Partly Cloudy</small>
                            </div>
                            <div class="hour-slot">
                                <span>21:00</span>
                                <strong>20°C</strong>
                                <small>Clear</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
